[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceconv"
version = "0.1.0"
description = "Zero-shot speech-to-singing voice conversion desktop application"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5",
    "numpy>=1.24,<2.0",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pyworld>=0.3.4",
    "resemblyzer>=0.1.3",
    "demucs>=4.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "pydub>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
    "pytest-cov>=4.0",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
voiceconv = "voiceconv.app:main"

[project.gui-scripts]
voiceconv-gui = "voiceconv.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that require model downloads or heavy computation",
    "gui: marks tests that require a display server",
]
